<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dala Erick - Portfolio</title>
  <style>
    /* --- RESET & VARIABLES --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --accent-orange: #d97736;
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    body {
      font-family: var(--font-sans);
      background-color: #070707;
      color: var(--text-white);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      perspective: 1200px;
    }

    /* --- BACKGROUND SLIDER & ZOOM ANIMATIONS --- */
    .bg-slider {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transform-style: preserve-3d;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) translateZ(-100px);
      will-change: transform, opacity;
    }

    .bg-slide.active {
      opacity: 0.45;
      transform: scale(1) translateZ(0);
      animation: zoomInFromDepth 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .bg-slide.exit {
      animation: zoomOutToScreen 1.1s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes zoomInFromDepth {
      0% {
        opacity: 0;
        transform: scale(0.85) translateZ(-150px);
      }
      100% {
        opacity: 0.45;
        transform: scale(1) translateZ(0);
      }
    }

    @keyframes zoomOutToScreen {
      0% {
        opacity: 0.45;
        transform: scale(1) translateZ(0);
      }
      100% {
        opacity: 0;
        transform: scale(1.4) translateZ(200px);
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* --- RESPONSIVE HEADER --- */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .brand-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      max-width: 180px;
      line-height: 1.3;
      border-left: 1px solid rgba(255,255,255,0.25);
      padding-left: 1rem;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
      cursor: pointer;
      position: relative;
    }

    nav a.active, nav a:hover {
      color: var(--text-white);
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-orange);
    }

    /* --- HERO CONTENT AREA --- */
    main {
      position: relative;
      z-index: 5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10vw;
    }

    .section-content {
      display: none;
      flex-direction: column;
    }

    .section-content.active {
      display: flex;
    }

    .text-mask {
      overflow: hidden;
      display: block;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      transform: translateY(100%);
      opacity: 0;
    }

    .section-content.active .subtitle {
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .main-title-container {
      display: flex;
      align-items: flex-end;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .main-title {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 7vw, 7.5rem);
      line-height: 0.95;
      text-transform: uppercase;
      font-weight: 400;
      letter-spacing: -1px;
      transform: translateY(100%) scale(0.95);
      opacity: 0;
    }

    .section-content.active .main-title {
      animation: slideUpZoom 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .badge {
      color: var(--accent-orange);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: lowercase;
      border-bottom: 1px solid var(--accent-orange);
      padding-bottom: 2px;
      margin-bottom: 1.2rem;
      opacity: 0;
      transform: translateY(20px);
    }

    .section-content.active .badge {
      animation: fadeIn 0.8s ease-out 0.6s forwards;
    }

    /* KEYFRAMES */
    @keyframes slideUp {
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideUpZoom {
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- FOOTER & ACTION BUTTONS --- */
    .corner-info {
      position: absolute;
      bottom: 2.5rem;
      left: 4rem;
      z-index: 10;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.6;
      letter-spacing: 1px;
      max-width: 50vw;
    }

    .corner-info strong {
      color: var(--text-white);
      display: block;
      margin-bottom: 0.2rem;
    }

    .next-btn {
      position: absolute;
      bottom: 2.5rem;
      right: 4rem;
      z-index: 10;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent-orange);
      border: none;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(217, 119, 54, 0.3);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .next-btn:hover {
      transform: scale(1.15) rotate(5deg);
    }

    .next-btn svg {
      width: 20px;
      height: 20px;
      fill: #000;
    }

    /* --- MOBILE RESPONSIVE MEDIA QUERIES --- */
    @media (max-width: 768px) {
      header {
        padding: 1.5rem 1.5rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }

      .brand-tag {
        display: none; /* Hide subtitle tag on small screens to save room */
      }

      nav {
        width: 100%;
        justify-content: space-between;
        gap: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 0.8rem;
      }

      nav a {
        font-size: 0.75rem;
        letter-spacing: 1px;
      }

      main {
        padding: 0 1.5rem;
      }

      .main-title-container {
        gap: 0.8rem;
      }

      .corner-info {
        left: 1.5rem;
        bottom: 1.5rem;
        font-size: 0.65rem;
        max-width: 60vw;
      }

      .next-btn {
        right: 1.5rem;
        bottom: 1.5rem;
        width: 45px;
        height: 45px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Image Slides -->
  <div class="bg-slider">
    <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80');"></div>
  </div>
  
  <div class="overlay"></div>

  <!-- Responsive Header -->
  <header>
    <div class="brand">
      <div class="logo">DALA ERICK</div>
      <div class="brand-tag">FULL-STACK ENGINEER & CREATIVE DEVELOPER</div>
    </div>
    <nav>
      <a class="nav-link active" onclick="handleNavClick(0)">Home</a>
      <a class="nav-link" onclick="handleNavClick(1)">Experience</a>
      <a class="nav-link" onclick="handleNavClick(2)">About</a>
    </nav>
  </header>

  <!-- Content Slides -->
  <main>
    <!-- Slide 1: Intro -->
    <div class="section-content active">
      <div class="text-mask">
        <p class="subtitle">CREATIVE VISION</p>
      </div>
      <div class="main-title-container">
        <div class="text-mask">
          <h1 class="main-title">THE ART<br>OF CODE</h1>
        </div>
        <span class="badge">digital experiences</span>
      </div>
    </div>

    <!-- Slide 2: Experience -->
    <div class="section-content">
      <div class="text-mask">
        <p class="subtitle">PROJECTS & WORK</p>
      </div>
      <div class="main-title-container">
        <div class="text-mask">
          <h1 class="main-title">BUILDING<br>SYSTEMS</h1>
        </div>
        <span class="badge">full-stack mastery</span>
      </div>
    </div>

    <!-- Slide 3: About -->
    <div class="section-content">
      <div class="text-mask">
        <p class="subtitle">BACKGROUND</p>
      </div>
      <div class="main-title-container">
        <div class="text-mask">
          <h1 class="main-title">A WALK IN<br>DESIGN</h1>
        </div>
        <span class="badge">problem solver</span>
      </div>
    </div>
  </main>

  <!-- Corner Details -->
  <div class="corner-info">
    <strong>AVAILABLE FOR FREELANCE & FULL-TIME</strong>
    NEW YORK, NY / REMOTE WORLDWIDE
  </div>

  <!-- Animated Circular Arrow Button -->
  <button class="next-btn" onclick="handleNextClick()" aria-label="Next Slide">
    <svg viewBox="0 0 24 24">
      <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
    </svg>
  </button>

  <script>
    let currentIndex = 0;
    let isAnimating = false;
    let autoSlideTimer = null;

    const slides = document.querySelectorAll('.bg-slide');
    const contents = document.querySelectorAll('.section-content');
    const navLinks = document.querySelectorAll('.nav-link');

    // Auto-play timer
    startAutoSlide();

    function startAutoSlide() {
      autoSlideTimer = setInterval(() => {
        nextSlide();
      }, 5000);
    }

    function resetAutoSlide() {
      clearInterval(autoSlideTimer);
      startAutoSlide();
    }

    function switchSlide(nextIndex) {
      if (isAnimating || nextIndex === currentIndex) return;
      isAnimating = true;

      const currentSlide = slides[currentIndex];
      const currentContent = contents[currentIndex];
      const nextSlideEl = slides[nextIndex];
      const nextContent = contents[nextIndex];

      // Update Nav active indicator
      navLinks[currentIndex].classList.remove('active');
      navLinks[nextIndex].classList.add('active');

      // Exit current slide towards screen
      currentSlide.classList.remove('active');
      currentSlide.classList.add('exit');

      currentContent.classList.remove('active');

      // Enter next slide
      nextSlideEl.classList.remove('exit');
      nextSlideEl.classList.add('active');
      nextContent.classList.add('active');

      setTimeout(() => {
        currentSlide.classList.remove('exit');
        currentIndex = nextIndex;
        isAnimating = false;
      }, 1100);
    }

    function nextSlide() {
      let next = (currentIndex + 1) % slides.length;
      switchSlide(next);
    }

    function prevSlide() {
      let prev = (currentIndex - 1 + slides.length) % slides.length;
      switchSlide(prev);
    }

    function handleNavClick(index) {
      switchSlide(index);
      resetAutoSlide();
    }

    function handleNextClick() {
      nextSlide();
      resetAutoSlide();
    }

    /* --- MOUSE WHEEL SCROLL --- */
    let lastScrollTime = 0;
    window.addEventListener('wheel', (e) => {
      const now = Date.now();
      if (now - lastScrollTime < 600 || isAnimating) return;

      if (e.deltaY > 0) {
        nextSlide();
        resetAutoSlide();
        lastScrollTime = now;
      } else if (e.deltaY < 0) {
        prevSlide();
        resetAutoSlide();
        lastScrollTime = now;
      }
    }, { passive: true });

    /* --- TOUCH & SWIPE EVENTS FOR MOBILE --- */
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;

      let deltaX = touchEndX - touchStartX;
      let deltaY = touchEndY - touchStartY;

      // Ensure horizontal swipe is dominant over vertical scrolling
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
        if (deltaX < 0) {
          // Swipe Left -> Next slide
          nextSlide();
          resetAutoSlide();
        } else {
          // Swipe Right -> Previous slide
          prevSlide();
          resetAutoSlide();
        }
      }
    }, { passive: true });
  </script>
</body>
</html>
